<style>
:root {
  --bg: #070b16; --panel: #0f182b; --line: rgba(255,255,255,.12); --text: rgba(255,255,255,.92); --text-2: rgba(255,255,255,.72); --text-3: rgba(255,255,255,.55);
  --brand: #4a9eff; --brand-2: #4a9eff; --chip: rgba(255,255,255,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: radial-gradient(900px 480px at 80% -10%, rgba(74,158,255,.10), transparent 60%), var(--bg); color: var(--text); font: 15px/1.6 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--brand-2); }
.top { border-bottom: 1px solid var(--line); }
.top .in { max-width: 820px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
.mark { width: 26px; height: 26px; }
.brand { font-family: 'Cal Sans', Inter, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.01em; }
.brand small { display: block; font: 500 11px/1.2 Inter, sans-serif; color: var(--text-3); letter-spacing: 0.02em; }
.tag { margin-left: auto; font-size: 11.5px; color: var(--text-3); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; }
main { max-width: 820px; margin: 0 auto; padding: 48px 24px 96px; }
.meta { font-size: 13px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 4px 14px; }
h1 { font-family: 'Cal Sans', Inter, sans-serif; font-weight: 400; font-size: 38px; line-height: 1.1; letter-spacing: -0.01em; margin: 10px 0 16px; }
.people { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 28px; }
.chip { background: var(--chip); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; font-size: 12.5px; color: var(--text-2); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-3); font: 600 13.5px Inter, sans-serif; padding: 9px 12px; cursor: pointer; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-color: var(--brand-2); }
.md h1, .md h2, .md h3 { font-family: 'Cal Sans', Inter, sans-serif; letter-spacing: -0.005em; line-height: 1.3; }
.md h1 { font-size: 20px; margin: 26px 0 8px; } .md h2 { font-size: 17px; margin: 24px 0 6px; } .md h3 { font-size: 15px; margin: 18px 0 4px; }
.md > :first-child { margin-top: 0; }
.md ul, .md ol { padding-left: 22px; } .md li { margin: 3px 0; }
.md p { margin: 8px 0; color: var(--text); }
.md code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.md table { border-collapse: collapse; width: 100%; font-size: 13.5px; } .md td, .md th { border: 1px solid var(--line); padding: 5px 8px; text-align: left; }
.md blockquote { margin: 10px 0; padding: 2px 14px; border-left: 3px solid var(--brand); color: var(--text-2); }
.lines { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 54px 1fr; gap: 10px; }
.untimed .line { grid-template-columns: 1fr; } .untimed .line .t { display: none; }
.line .t { color: var(--text-3); font-size: 12px; padding-top: 2px; font-variant-numeric: tabular-nums; }
.line b { font-size: 12.5px; color: var(--brand-2); display: block; }
.line.me b { color: var(--text-3); }
.line p { margin: 0; color: var(--text); }
.empty, .state { color: var(--text-3); padding: 40px 0; text-align: center; }
.state h1 { font-size: 22px; color: var(--text); }
footer { max-width: 820px; margin: 0 auto; padding: 0 20px 40px; font-size: 12px; color: var(--text-3); }
@media (max-width: 560px) { h1 { font-size: 24px; } .line { grid-template-columns: 1fr; gap: 0; } .tag { display: none; } }
</style>
</head>
